<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Zap Arsenal</title>
    <link rel="icon" type="image/jpeg" href="images/quake-box-art.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/quake-hud.css">
    <style>
        :root {
            --bg-dark: #0f0b07;
            --accent-orange: #8f4b23;
            --accent-gold: #a77b3b;
            --text-primary: #c7a35b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Press Start 2P', monospace;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        .error-face {
            width: 96px;
            height: 96px;
            margin: 0 auto 30px;
            background-image: url('images/quake-faces.jpg');
            background-size: 288px 480px;
            /* Row 4 col 1 - bloodiest dying face */
            background-position: -96px -384px;
            image-rendering: pixelated;
            border: 4px solid #8b0000;
            box-shadow: 0 0 30px rgba(139,0,0,0.5);
        }

        .error-code {
            font-size: 4rem;
            color: #ff0000;
            text-shadow:
                4px 4px 0 #000,
                0 0 30px rgba(255,0,0,0.5);
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .error-title {
            font-size: 1.2rem;
            color: var(--accent-orange);
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 0.6rem;
            color: var(--accent-gold);
            line-height: 2;
            margin-bottom: 40px;
        }

        .home-link {
            display: inline-block;
            font-size: 0.7rem;
            padding: 15px 30px;
            background: linear-gradient(180deg, #8f4b23 0%, #5b2b0b 100%);
            color: #c7a35b;
            text-decoration: none;
            border: 2px solid #a77b3b;
            transition: all 0.3s;
        }

        .home-link:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(143, 75, 35, 0.6);
        }

        .quake-quote {
            margin-top: 60px;
            font-size: 0.5rem;
            color: #7f5f3b;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-face"></div>
        <div class="error-code">404</div>
        <h1 class="error-title">PAGE NOT FOUND</h1>
        <p class="error-message">
            You have been killed by a Shambler.<br>
            The page you seek has been fragged.
        </p>
        <a href="index.html" class="home-link">RESPAWN AT START</a>
        <p class="quake-quote">"Reznor was here"</p>
    </div>

    <audio id="death-sound" autoplay>
        <source src="audio/death.wav" type="audio/wav">
    </audio>
</body>
</html>
