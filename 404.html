<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Zap Arena</title>
    <link rel="icon" type="image/jpeg" href="images/quake-box-art.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/quake-hud.css">
    <style>
        :root {
            --bg-dark: #0f0b07;
            --accent-orange: #8f4b23;
            --accent-gold: #a77b3b;
            --text-primary: #c7a35b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Press Start 2P', monospace;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        .error-face {
            width: 96px;
            height: 96px;
            margin: 0 auto 30px;
            background-image: url('images/quake-faces.jpg');
            background-size: 288px 480px;
            /* Row 4 col 1 - bloodiest gibbed face (288x480 sheet, each face is 96x96) */
            background-position: -96px -384px;
            image-rendering: pixelated;
            border: 4px solid #8b0000;
            box-shadow: 0 0 30px rgba(139,0,0,0.5);
        }

        .error-code {
            font-size: 4rem;
            color: #ff0000;
            text-shadow:
                4px 4px 0 #000,
                0 0 30px rgba(255,0,0,0.5);
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .error-title {
            font-size: 1.2rem;
            color: var(--accent-orange);
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 0.6rem;
            color: var(--accent-gold);
            line-height: 2;
            margin-bottom: 40px;
        }

        .home-link {
            display: inline-block;
            font-size: 0.7rem;
            padding: 15px 30px;
            background: linear-gradient(180deg, #8f4b23 0%, #5b2b0b 100%);
            color: #c7a35b;
            text-decoration: none;
            border: 2px solid #a77b3b;
            transition: all 0.3s;
        }

        .home-link:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(143, 75, 35, 0.6);
        }

        .quake-quote {
            margin-top: 60px;
            font-size: 0.5rem;
            color: #7f5f3b;
            font-style: italic;
        }

        .nin-ammo {
            width: 120px;
            height: auto;
            margin-top: 20px;
            image-rendering: pixelated;
            filter: drop-shadow(0 0 10px rgba(139, 0, 0, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* CRT Scanlines */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.25),
                rgba(0, 0, 0, 0.25) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.6;
        }

        /* Blood Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9997;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(139, 0, 0, 0.5) 100%);
        }
    </style>
</head>
<body>
    <!-- CRT Effects -->
    <div class="crt-overlay"></div>
    <div class="vignette"></div>
    <div class="error-container">
        <div class="error-face"></div>
        <div class="error-code">404</div>
        <h1 class="error-title">PAGE NOT FOUND</h1>
        <p class="error-message">
            You have been killed by a Shambler.<br>
            The page you seek has been fragged.
        </p>
        <a href="index.html" class="home-link">RESPAWN AT START</a>
        <p class="quake-quote">"Reznor was here"</p>
        <img src="images/nin-ammo.png" alt="NIN Ammo Box" class="nin-ammo" title="Trent Reznor composed the Quake soundtrack">
    </div>

    <audio id="death-sound" autoplay>
        <source src="audio/death.wav" type="audio/wav">
    </audio>

    <!-- Secret Banner -->
    <div id="secretBanner" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10001; background: rgba(0,0,0,0.95); border: 3px solid #cf6b2f; padding: 2rem 3rem; text-align: center; font-family: 'Press Start 2P', cursive;">
        <div style="color: #cf6b2f; font-size: 1.5rem; text-shadow: 0 0 20px #cf6b2f; animation: pulse 0.5s ease-in-out infinite;">SECRET FOUND!</div>
        <div id="secretCount" style="color: #ffcc00; font-size: 0.8rem; margin-top: 1rem;">SECRET 3 OF 5</div>
        <div style="color: #888; font-size: 0.5rem; margin-top: 0.5rem;">Trent Reznor's signature</div>
    </div>

    <script src="js/difficulty.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/secrets.js"></script>
    <script>
        // Secret 3: NIN Ammo Box Easter Egg
        (function() {
            const ninAmmo = document.querySelector('.nin-ammo');
            const secretBanner = document.getElementById('secretBanner');
            let secret3Found = localStorage.getItem('zaparena_secret3') === 'true';

            if (!ninAmmo) return;

            // Make it clickable
            ninAmmo.style.cursor = 'pointer';

            ninAmmo.addEventListener('click', function(e) {
                if (secret3Found) return;

                // Mark as found
                localStorage.setItem('zaparena_secret3', 'true');
                secret3Found = true;

                // Update HUD
                if (window.ZapArena && window.ZapArena.updateSecretsDisplay) {
                    window.ZapArena.updateSecretsDisplay();
                }

                // Count total secrets for banner
                let count = 0;
                for (let i = 1; i <= 5; i++) {
                    if (localStorage.getItem('zaparena_secret' + i) === 'true') count++;
                }
                document.getElementById('secretCount').textContent = 'SECRET ' + count + ' OF 5';

                // Show banner
                secretBanner.style.display = 'block';

                // Play sound
                try {
                    const sound = new Audio('audio/pickup.wav');
                    sound.volume = 0.5;
                    sound.play().catch(() => {});
                } catch(e) {}

                // Make ammo box glow
                ninAmmo.style.filter = 'drop-shadow(0 0 30px #cf6b2f) drop-shadow(0 0 60px #cf6b2f)';
                ninAmmo.style.animation = 'none';

                // Hide banner after 3 seconds
                setTimeout(() => {
                    secretBanner.style.display = 'none';
                }, 3000);

                console.log('[Secret 3] NIN Ammo Box discovered!');
            });
        })();
    </script>
</body>
</html>
