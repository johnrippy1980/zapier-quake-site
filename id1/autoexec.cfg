// Modern FPS Controls for WebQuake
// WASD movement + permanent mouselook

// Clear old bindings first
unbindall

// === WASD Movement ===
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"

// === Mouse ===
bind MOUSE1 "+attack"
bind MOUSE2 "+jump"

// === Other Movement ===
bind SPACE "+jump"
bind SHIFT "+speed"
bind CTRL "+movedown"

// === Weapons (number keys) ===
bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"

// === Mouse wheel weapon switching ===
bind MWHEELUP "impulse 10"
bind MWHEELDOWN "impulse 12"

// === UI ===
bind ESCAPE "togglemenu"
bind ~ "toggleconsole"
bind TAB "+showscores"

// === Enable permanent mouselook ===
+mlook

// === Mouse sensitivity (adjust to taste) ===
sensitivity 3

// === Disable view bobbing for smoother feel ===
cl_bob 0

echo "Modern FPS controls loaded!"
