<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Play Quake | Zap Arsenal</title>
    <meta name="description" content="Play Quake in your browser! Modern WASD controls + mouselook. A tribute to the classic 1996 FPS by id Software.">
    <link rel="icon" type="image/jpeg" href="images/quake-box-art.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/quake-hud.css">
    <style>
        :root {
            /* Authentic Quake 1 Color Palette */
            --bg-dark: #0f0b07;
            --bg-card: #1f170b;
            --bg-medium: #271b0f;
            --accent-orange: #8f4b23;
            --accent-brown: #4b371b;
            --accent-gold: #a77b3b;
            --accent-red: #8b0000;
            --text-primary: #c7a35b;
            --text-secondary: #7f5f3b;
            --border: #3b2b17;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #000;
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(180deg, #1f170b 0%, #0f0b07 100%);
            border-bottom: 2px solid #4b371b;
            z-index: 1001;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }
        .nav-logo img {
            height: 35px;
            width: auto;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-link {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            color: var(--text-primary);
            text-decoration: none;
            padding: 6px 10px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: var(--accent-orange);
            border-color: var(--accent-orange);
        }

        /* Game Container */
        .game-container {
            position: fixed;
            top: 50px;
            left: 0;
            right: 0;
            bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* Arcade Cabinet Wrapper */
        .arcade-cabinet {
            position: relative;
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 4px solid #444;
            border-top-color: #555;
            border-left-color: #555;
            border-radius: 10px 10px 0 0;
            padding: 15px;
            box-shadow:
                0 0 50px rgba(143, 75, 35, 0.5),
                inset 0 2px 0 #5a5a5a,
                inset 0 -2px 0 #1a1a1a;
        }

        .arcade-cabinet::before {
            content: 'CLICK GAME TO CAPTURE MOUSE';
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            color: var(--accent-gold);
            animation: blink 1s step-end infinite;
            white-space: nowrap;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .screen-bezel {
            background: #111;
            border: 6px solid #333;
            border-top-color: #222;
            border-left-color: #222;
            border-radius: 4px;
            padding: 8px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* WebQuake Canvas */
        #mainwindow {
            display: block;
            width: 800px;
            height: 600px;
            background: #0f0b07;
            cursor: crosshair;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            background: rgba(15, 11, 7, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 4px;
        }
        .loading-overlay.hidden { display: none; }

        .loading-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
            color: var(--accent-orange);
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 20px;
        }
        .loading-subtitle {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            color: var(--accent-gold);
            margin-bottom: 30px;
        }
        #progress {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            color: var(--text-secondary);
        }

        /* Hidden WebQuake elements */
        #loading, #end, #end1, #end2 { display: none !important; }

        /* Control Buttons */
        .control-buttons {
            position: absolute;
            top: -25px;
            right: 0;
            display: flex;
            gap: 8px;
        }
        .control-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.4rem;
            padding: 5px 10px;
            background: rgba(0,0,0,0.8);
            color: var(--accent-orange);
            border: 1px solid var(--accent-orange);
            cursor: pointer;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: rgba(143, 75, 35, 0.3);
        }

        /* Controls HUD */
        .controls-hud {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #271b0f 0%, #1f170b 50%, #0f0b07 100%);
            border-top: 2px solid #4b371b;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 0 20px;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-key {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.45rem;
            background: #170f0b;
            border: 1px solid #4b371b;
            padding: 3px 6px;
            color: #a77b3b;
        }
        .control-label {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.35rem;
            color: var(--text-secondary);
        }

        /* Music Player */
        .music-player {
            position: fixed;
            bottom: 70px;
            right: 20px;
            z-index: 1000;
        }
        .music-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            padding: 8px 12px;
            background: rgba(0,0,0,0.8);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .music-btn:hover {
            background: rgba(167, 123, 59, 0.2);
        }

        /* Responsive */
        @media (max-width: 900px) {
            #mainwindow {
                width: 640px;
                height: 480px;
            }
        }
        @media (max-width: 700px) {
            #mainwindow {
                width: 100%;
                height: auto;
                aspect-ratio: 4/3;
            }
            .arcade-cabinet {
                width: calc(100% - 20px);
                padding: 8px;
            }
            .controls-hud {
                gap: 10px;
            }
            .control-item { display: none; }
            .control-item:nth-child(-n+4) { display: flex; }
        }
    </style>
</head>
<body>

    <!-- WebQuake Shader Scripts (Required) -->
    <script type="x-shader/x-vertex" id="vshAlias">
uniform vec3 uOrigin;
uniform mat3 uAngles;
uniform vec3 uViewOrigin;
uniform mat3 uViewAngles;
uniform mat4 uPerspective;
uniform vec3 uLightVec;
attribute vec3 aPosition;
attribute vec3 aNormal;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
varying float vLightDot;
void main(void)
{
	vec3 position = uViewAngles * (uAngles * aPosition + uOrigin - uViewOrigin);
	gl_Position = uPerspective * vec4(position.xz, -position.y, 1.0);
	vTexCoord = aTexCoord;
	vLightDot = dot(aNormal, uLightVec);
}
    </script>
    <script type="x-shader/x-fragment" id="fshAlias">
precision mediump float;
uniform float uGamma;
uniform float uAmbientLight;
uniform float uShadeLight;
uniform sampler2D tTexture;
varying vec2 vTexCoord;
varying float vLightDot;
void main(void)
{
	vec4 texture = texture2D(tTexture, vTexCoord);
	gl_FragColor = vec4(texture.rgb * mix(1.0, vLightDot * uShadeLight + uAmbientLight, texture.a), 1.0);
	gl_FragColor.r = pow(gl_FragColor.r, uGamma);
	gl_FragColor.g = pow(gl_FragColor.g, uGamma);
	gl_FragColor.b = pow(gl_FragColor.b, uGamma);
}
    </script>
    <script type="x-shader/x-vertex" id="vshBrush">
uniform vec3 uOrigin;
uniform mat3 uAngles;
uniform vec3 uViewOrigin;
uniform mat3 uViewAngles;
uniform mat4 uPerspective;
attribute vec3 aPosition;
attribute vec4 aTexCoord;
attribute vec4 aLightStyle;
varying vec4 vTexCoord;
varying vec4 vLightStyle;
void main(void)
{
	vec3 position = uViewAngles * (uAngles * aPosition + uOrigin - uViewOrigin);
	gl_Position = uPerspective * vec4(position.xz, -position.y, 1.0);
	vTexCoord = aTexCoord;
	vLightStyle = aLightStyle;
}
    </script>
    <script type="x-shader/x-fragment" id="fshBrush">
precision mediump float;
uniform float uGamma;
uniform sampler2D tTexture;
uniform sampler2D tLightmap;
uniform sampler2D tDlight;
uniform sampler2D tLightStyle;
varying vec4 vTexCoord;
varying vec4 vLightStyle;
void main(void)
{
	vec4 texture = texture2D(tTexture, vTexCoord.xy);
	gl_FragColor = vec4(texture.rgb *
		mix(1.0, dot(texture2D(tLightmap, vTexCoord.zw), vec4(
			texture2D(tLightStyle, vec2(vLightStyle.x, 0.0)).a,
			texture2D(tLightStyle, vec2(vLightStyle.y, 0.0)).a,
			texture2D(tLightStyle, vec2(vLightStyle.z, 0.0)).a,
			texture2D(tLightStyle, vec2(vLightStyle.w, 0.0)).a)
		* 43.828125) + texture2D(tDlight, vTexCoord.zw).a, texture.a), 1.0);
	gl_FragColor.r = pow(gl_FragColor.r, uGamma);
	gl_FragColor.g = pow(gl_FragColor.g, uGamma);
	gl_FragColor.b = pow(gl_FragColor.b, uGamma);
}
    </script>
    <script type="x-shader/x-vertex" id="vshCharacter">
uniform vec2 uCharacter;
uniform vec2 uDest;
uniform mat4 uOrtho;
attribute vec2 aPosition;
varying vec2 vTexCoord;
void main(void)
{
	gl_Position = uOrtho * vec4(aPosition * 8.0 + uDest, 0.0, 1.0);
	vTexCoord = (aPosition + uCharacter) * 0.0625;
}
    </script>
    <script type="x-shader/x-fragment" id="fshCharacter">
precision mediump float;
uniform sampler2D tTexture;
varying vec2 vTexCoord;
void main(void)
{
	gl_FragColor = texture2D(tTexture, vTexCoord);
}
    </script>
    <script type="x-shader/x-vertex" id="vshDlight">
uniform vec3 uOrigin;
uniform vec3 uViewOrigin;
uniform mat3 uViewAngles;
uniform mat4 uPerspective;
uniform float uRadius;
attribute vec3 aPosition;
varying float vAlpha;
void main(void)
{
	vec3 position = aPosition * 0.35 * uRadius + uViewAngles * (uOrigin - uViewOrigin);
	gl_Position = uPerspective * vec4(position.xz, -position.y, 1.0);
	vAlpha = aPosition.y * -0.2;
}
    </script>
    <script type="x-shader/x-fragment" id="fshDlight">
precision mediump float;
uniform float uGamma;
varying float vAlpha;
void main(void)
{
	gl_FragColor = vec4(pow(1.0, uGamma), pow(0.5, uGamma), 0.0, vAlpha);
}
    </script>
    <script type="x-shader/x-vertex" id="vshFill">
uniform mat4 uOrtho;
attribute vec2 aPosition;
attribute vec4 aColor;
varying vec4 vColor;
void main(void)
{
	gl_Position = uOrtho * vec4(aPosition, 0.0, 1.0);
	vColor = aColor;
}
    </script>
    <script type="x-shader/x-fragment" id="fshFill">
precision mediump float;
varying vec4 vColor;
void main(void)
{
	gl_FragColor = vColor;
}
    </script>
    <script type="x-shader/x-vertex" id="vshParticle">
uniform vec3 uViewOrigin;
uniform mat3 uViewAngles;
uniform mat4 uPerspective;
uniform float uScale;
attribute vec3 aOrigin;
attribute vec2 aCoord;
attribute float aScale;
attribute vec3 aColor;
varying vec2 vCoord;
varying vec3 vColor;
void main(void)
{
	vec2 point = aCoord * aScale;
	vec3 position = vec3(point.x, 0.0, point.y) + uViewAngles * (aOrigin - uViewOrigin);
	gl_Position = uPerspective * vec4(position.xz, -position.y, 1.0);
	vCoord = aCoord;
	vColor = aColor;
}
    </script>
    <script type="x-shader/x-fragment" id="fshParticle">
precision mediump float;
uniform float uGamma;
varying vec2 vCoord;
varying vec3 vColor;
void main(void)
{
	gl_FragColor = vec4(vColor, 1.0 - smoothstep(0.75, 1.0, length(vCoord)));
	gl_FragColor.r = pow(gl_FragColor.r, uGamma);
	gl_FragColor.g = pow(gl_FragColor.g, uGamma);
	gl_FragColor.b = pow(gl_FragColor.b, uGamma);
}
    </script>
    <script type="x-shader/x-vertex" id="vshPic">
uniform mat4 uOrtho;
attribute vec2 aPosition;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
void main(void)
{
	gl_Position = uOrtho * vec4(aPosition, 0.0, 1.0);
	vTexCoord = aTexCoord;
}
    </script>
    <script type="x-shader/x-fragment" id="fshPic">
precision mediump float;
uniform sampler2D tTexture;
varying vec2 vTexCoord;
void main(void)
{
	gl_FragColor = texture2D(tTexture, vTexCoord);
}
    </script>
    <script type="x-shader/x-vertex" id="vshPicTranslate">
uniform mat4 uOrtho;
attribute vec2 aPosition;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
void main(void)
{
	gl_Position = uOrtho * vec4(aPosition, 0.0, 1.0);
	vTexCoord = aTexCoord;
}
    </script>
    <script type="x-shader/x-fragment" id="fshPicTranslate">
precision mediump float;
uniform vec3 uTop;
uniform vec3 uBottom;
uniform sampler2D tTexture;
uniform sampler2D tTrans;
varying vec2 vTexCoord;
void main(void)
{
	vec4 texture = texture2D(tTexture, vTexCoord);
	vec4 trans = texture2D(tTrans, vTexCoord);
	gl_FragColor = vec4(mix(mix(texture.rgb, uTop * trans.x, trans.y), uBottom * trans.z, trans.w), texture.a);
}
    </script>
    <script type="x-shader/x-vertex" id="vshPlayer">
uniform vec3 uOrigin;
uniform mat3 uAngles;
uniform vec3 uViewOrigin;
uniform mat3 uViewAngles;
uniform mat4 uPerspective;
uniform vec3 uLightVec;
attribute vec3 aPosition;
attribute vec3 aNormal;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
varying float vLightDot;
void main(void)
{
	vec3 position = uViewAngles * (uAngles * aPosition + uOrigin - uViewOrigin);
	gl_Position = uPerspective * vec4(position.xz, -position.y, 1.0);
	vTexCoord = aTexCoord;
	vLightDot = dot(aNormal, uLightVec);
}
    </script>
    <script type="x-shader/x-fragment" id="fshPlayer">
precision mediump float;
uniform float uGamma;
uniform float uAmbientLight;
uniform float uShadeLight;
uniform vec3 uTop;
uniform vec3 uBottom;
uniform sampler2D tTexture;
uniform sampler2D tPlayer;
varying vec2 vTexCoord;
varying float vLightDot;
void main(void)
{
	vec4 texture = texture2D(tTexture, vTexCoord);
	vec4 player = texture2D(tPlayer, vTexCoord);
	gl_FragColor = vec4(
		mix(mix(texture.rgb, uTop * (1.0 / 191.25) * player.x, player.y), uBottom * (1.0 / 191.25) * player.z, player.w)
		* mix(1.0, vLightDot * uShadeLight + uAmbientLight, texture.a), 1.0);
	gl_FragColor.r = pow(gl_FragColor.r, uGamma);
	gl_FragColor.g = pow(gl_FragColor.g, uGamma);
	gl_FragColor.b = pow(gl_FragColor.b, uGamma);
}
    </script>
    <script type="x-shader/x-vertex" id="vshSky">
uniform mat3 uViewAngles;
uniform mat4 uPerspective;
uniform vec3 uScale;
attribute vec3 aPosition;
varying vec2 vTexCoord;
void main(void)
{
	vec3 position = uViewAngles * (aPosition * uScale * 18918.0);
	gl_Position = uPerspective * vec4(position.xz, -position.y, 1.0);
	vTexCoord = aPosition.xy * uScale.xy * 1.5;
}
    </script>
    <script type="x-shader/x-fragment" id="fshSky">
precision mediump float;
uniform float uGamma;
uniform vec2 uTime;
uniform sampler2D tSolid;
uniform sampler2D tAlpha;
varying vec2 vTexCoord;
void main(void)
{
	vec4 alpha = texture2D(tAlpha, vTexCoord + uTime.x);
	gl_FragColor = vec4(mix(texture2D(tSolid, vTexCoord + uTime.y).rgb, alpha.rgb, alpha.a), 1.0);
	gl_FragColor.r = pow(gl_FragColor.r, uGamma);
	gl_FragColor.g = pow(gl_FragColor.g, uGamma);
	gl_FragColor.b = pow(gl_FragColor.b, uGamma);
}
    </script>
    <script type="x-shader/x-vertex" id="vshSkyChain">
uniform vec3 uViewOrigin;
uniform mat3 uViewAngles;
uniform mat4 uPerspective;
attribute vec3 aPosition;
void main(void)
{
	vec3 position = uViewAngles * (aPosition - uViewOrigin);
	gl_Position = uPerspective * vec4(position.xz, -position.y, 1.0);
}
    </script>
    <script type="x-shader/x-fragment" id="fshSkyChain">
precision mediump float;
void main(void)
{
}
    </script>
    <script type="x-shader/x-vertex" id="vshSprite">
uniform vec4 uRect;
uniform vec3 uViewOrigin;
uniform mat3 uViewAngles;
uniform mat4 uPerspective;
attribute vec3 aPosition;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
void main(void)
{
	vec3 position = uViewAngles * (aPosition - uViewOrigin);
	gl_Position = uPerspective * vec4(position.xz, -position.y, 1.0);
	vTexCoord = aTexCoord;
}
    </script>
    <script type="x-shader/x-fragment" id="fshSprite">
precision mediump float;
uniform float uGamma;
uniform sampler2D tTexture;
varying vec2 vTexCoord;
void main(void)
{
	gl_FragColor = texture2D(tTexture, vTexCoord);
	gl_FragColor.r = pow(gl_FragColor.r, uGamma);
	gl_FragColor.g = pow(gl_FragColor.g, uGamma);
	gl_FragColor.b = pow(gl_FragColor.b, uGamma);
}
    </script>
    <script type="x-shader/x-vertex" id="vshTurbulent">
uniform vec3 uOrigin;
uniform mat3 uAngles;
uniform vec3 uViewOrigin;
uniform mat3 uViewAngles;
uniform mat4 uPerspective;
attribute vec3 aPosition;
attribute vec2 aTexCoord;

    <script>
        // UI Controls
        const canvas = document.getElementById('mainwindow');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const musicBtn = document.getElementById('musicBtn');
        const musicText = document.getElementById('musicText');
        const quakeTheme = document.getElementById('quake-theme');

        // Hide loading overlay once game starts rendering
        // WebQuake will hide #progress, we watch for that
        const progressEl = document.getElementById('progress');
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                    if (progressEl.style.display === 'none') {
                        loadingOverlay.classList.add('hidden');
                        canvas.focus();
                    }
                }
            });
        });
        observer.observe(progressEl, { attributes: true });

        // Also check periodically in case MutationObserver misses it
        const checkLoaded = setInterval(function() {
            if (progressEl.style.display === 'none' ||
                (typeof Host !== 'undefined' && Host.initialized)) {
                loadingOverlay.classList.add('hidden');
                canvas.focus();
                clearInterval(checkLoaded);
            }
        }, 500);

        // Fullscreen
        fullscreenBtn.addEventListener('click', function() {
            const cabinet = document.querySelector('.arcade-cabinet');
            if (cabinet.requestFullscreen) {
                cabinet.requestFullscreen();
            } else if (cabinet.webkitRequestFullscreen) {
                cabinet.webkitRequestFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', function() {
            fullscreenBtn.textContent = document.fullscreenElement ? 'EXIT' : 'FULLSCREEN';
        });

        // Music controls - auto-play on first user interaction
        let musicPlaying = false;
        let musicStarted = false;

        function startMusic() {
            if (musicStarted) return;
            quakeTheme.volume = 0.5; // 50% volume so it doesn't overpower game
            quakeTheme.play().then(function() {
                musicText.textContent = 'MUTE THEME';
                musicPlaying = true;
                musicStarted = true;
            }).catch(function() {});
        }

        // Auto-start music on any user interaction (browser requirement)
        document.addEventListener('click', startMusic, { once: true });
        document.addEventListener('keydown', startMusic, { once: true });

        musicBtn.addEventListener('click', function(e) {
            e.stopPropagation(); // Don't trigger the auto-start
            if (musicPlaying) {
                quakeTheme.pause();
                musicText.textContent = 'PLAY THEME';
                musicPlaying = false;
            } else {
                quakeTheme.play().then(function() {
                    musicText.textContent = 'MUTE THEME';
                    musicPlaying = true;
                    musicStarted = true;
                }).catch(function() {});
            }
        });

        // Focus canvas on click
        canvas.addEventListener('click', function() {
            canvas.focus();
        });
    </script>
